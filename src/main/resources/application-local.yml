spring:
  config:
    activate:
      on-profile: local

  management:
    endpoints:
      web:
        exposure:
          include: health,prometheus,metrics
    metrics:
      distribution:
        percentiles-histogram:
          http:
            server:
              requests: true

  cloud:
    gateway:
      routes:
        - id: catalog-service
          uri: http://catalog-service:8080
        - id: inventory-service
          uri: http://inventory-service:8080
        - id: order-service
          uri: http://order-service:8080
        - id: payment-service
          uri: http://payment-service:8080
      default-filters:
        - PreserveHostHeader
      globalcors:
        cors-configurations:
          '[/**]':
            allowedHeaders:
              - "*"
            allowedOrigins:
              - "*"
            allowedMethods:
              - "*"
